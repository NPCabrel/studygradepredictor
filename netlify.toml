# Netlify configuration — Study Grade Predictor

[build]
  publish = "."

# Redirect / to index.html (landing page)
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Redirect /app to the app
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

# Block keygen from being accessible publicly
[[redirects]]
  from = "/keygen.html"
  to = "/index.html"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-store"
